name: Verify and publish develop
on:
  push:
    branches: [main, feat/current-season-monochrome, feat/compact-formations-media]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: develop-publish
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build && npm test
      - run: npm run design:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-verification
          path: .preview/*.png
          include-hidden-files: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            noplexzone/smackover-football:develop
            noplexzone/smackover-football:sha-${{ github.sha }}
      - name: Smoke-test the actual nginx image
        run: |
          docker run -d --name smoke -p 8780:80 noplexzone/smackover-football:sha-${{ github.sha }}
          for page in index roster; do
            curl --fail --retry 8 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:8780/$page.html -o /tmp/$page.html
            cmp dist/$page.html /tmp/$page.html
          done
          test "$(docker inspect smoke --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ github.sha }}"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8780/nonexistent)" = 404
          for page in schedule program gameday community; do
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8780/$page.html)" = 404
          done
          for asset in styles.css roster.js assets/buckaroo-logo.png assets/field.webp assets/jersey-away-6.svg assets/jersey-home-6.svg; do
            curl --fail http://127.0.0.1:8780/$asset -o /tmp/check-asset
            cmp dist/$asset /tmp/check-asset
          done
          docker logs smoke
      - name: Publish only the verified acceptance image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push noplexzone/smackover-football:sha-${{ github.sha }}
          docker push noplexzone/smackover-football:develop
